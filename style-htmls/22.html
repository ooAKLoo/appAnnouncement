<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>SVG 渐变文字效果</title>
    <style>
        body {
            background-color: #1a1a1a; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* SVG 容器大小 */
        .svg-container {
            width: 500px;
            height: 300px;
        }
    </style>
</head>
<body>

    <div class="svg-container">
        <svg width="100%" height="100%" viewBox="0 0 500 300">
            
            <defs>
                <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff6b00; stop-opacity:1" /> <stop offset="50%" style="stop-color:#ff007f; stop-opacity:1" /> <stop offset="100%" style="stop-color:#00bfff; stop-opacity:1" /> </linearGradient>

                <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blurred" />
                    <feMerge>
                        <feMergeNode in="blurred" />
                        <feMergeNode in="blurred" />
                        <feMergeNode in="SourceGraphic" /> </feMerge>
                </filter>
            </defs>

            <text 
                x="50%" 
                y="50%" 
                dy=".35em" 
                text-anchor="middle" 
                font-family="Arial, sans-serif"
                font-size="150" 
                font-weight="bold"
                
                /* 关键步骤在这里 */
                fill="url(#liquidGradient)"   /* 1. 使用我们定义的渐变来填充文字 */
                filter="url(#glowFilter)"     /* 2. 应用我们定义的辉光滤镜 */
            >
                A
            </text>
            
            </svg>
    </div>

</body>
</html>
